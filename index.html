<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compressor Balancer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>Compressor Balancer</b> <small id="ver">0.1.0-alpha</small><span id="status">Drop STEP files to start</span></header>
<main>
<aside id="panel">
  <section>
    <h2>1 · Import</h2>
    <label id="drop" class="drop">Drop STEP (.stp/.step) here, or <u>browse</u>
      <input id="file" type="file" accept=".stp,.step" multiple hidden></label>
    <div class="row"><label title="accurate = two tessellations + Richardson extrapolation">Mass props <select id="quality"><option value="accurate" selected>accurate (2-pass)</option><option value="fast">fast</option></select></label>
      <label>Default <select id="defrho"><option value="7850">Steel 7850</option><option value="2700">Aluminium 2700</option><option value="7200">Cast iron 7200</option><option value="8900">Copper 8900</option></select> kg/m³</label></div>
    <table id="bodies"><thead><tr><th></th><th>Body</th><th>ρ kg/m³</th><th>Mass g</th></tr></thead><tbody></tbody></table>
  </section>
  <section>
    <h2>2 · Spin axis &amp; residuals</h2>
    <div class="row"><label>Axis <select id="axis"></select></label>
      <label>Origin <input id="ox" type="number" value="0" step="any"> <input id="oy" type="number" value="0" step="any"> <input id="oz" type="number" value="0" step="any"></label></div>
    <div id="resid" class="resid"></div>
  </section>
  <section>
    <h2>3 · Correction tools</h2>
    <div class="row"><button data-add="sector">+ Sector</button><button data-add="cylinder">+ Cylinder</button><button data-add="prism">+ Profile</button></div>
    <div id="tools"></div>
  </section>
  <section>
    <h2>4 · Optimise</h2>
    <p class="hint">Tick ☐ next to a tool value to free it, then set its bounds.</p>
    <div class="row"><label title="Weight on couple term">Couple weight <input id="wc" type="number" value="1" step="any"></label>
      <label title="Reference length converting g·mm² to g·mm (blank = axial span)">L mm <input id="lref" type="number" placeholder="auto" step="any"></label>
      <label title="Penalty on added mass²">Mass λ <input id="lam" type="number" value="0" step="any"></label></div>
    <div class="row"><button id="run" class="primary">Run optimiser</button><button id="undo" disabled>Undo</button></div>
    <div id="optout"></div>
  </section>
  <footer>Client-side only — files never leave this browser. <a href="THIRD_PARTY.md">Licenses</a> · <a href="https://github.com/kovacsv/occt-import-js">occt-import-js source</a></footer>
</aside>
<div id="view"></div>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
